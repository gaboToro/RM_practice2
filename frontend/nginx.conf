server {
    listen 80;

    location / {
        root /usr/share/nginx/html/pages;
        index register.html;
        try_files $uri $uri/ /register.html;
    }

    location /js/ {
        alias /usr/share/nginx/html/js/;
    }

    location /css/ {
        alias /usr/share/nginx/html/css/;
    }

    error_page 403 /register.html;
}
